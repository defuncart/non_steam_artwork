name: cd_main
on:
  push:
    tags:
      - '*'
env:
  BUILD_PATH_LINUX: build/linux/x64/release/bundle/
  BUILD_NAME_LINUX: non_steam_artwork
  ARTIFACT_NAME: non_steam_artwork
permissions:
  contents: write
jobs:
  create_release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'dev') }}
          generate_release_notes: false
  build_linux:
    name: Build + Upload Linux
    # Build using arch to avoid dependency issues for SteamOS
    runs-on: ubuntu-latest
    container:
      image: archlinux/archlinux:base-devel-20261018.0.612668
    steps:
      - name: Setup Arch Deps
        run: |
          pacman -Syu --noconfirm --needed
          pacman -S --noconfirm --needed \
            jq git
      - uses: actions/checkout@v1
      - uses: kuhnroyal/flutter-fvm-config-action@v2
        id: fvm-config-action
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm-config-action.outputs.FLUTTER_VERSION }}
          channel: ${{ steps.fvm-config-action.outputs.FLUTTER_CHANNEL }}
      # By default, git will block flutter as it has a different owner
      - name: Configure Git safe directory
        run: git config --global --add safe.directory '/__t/flutter/*'
      - name: Generate loca
        run: sh bin/loca_generate.sh true
      - name: Install packages
        run: flutter pub get
      # https://docs.flutter.dev/get-started/install/linux/desktop#development-tools
      - name: Install dependencies for Linux
        run: |
          pacman -S --noconfirm --needed \
            curl git unzip xz zip glu \
            clang cmake ninja pkgconf \
            gtk3 lz4 gcc rustup
      - name: Build Linux
        run: flutter build linux --release -v
      - name: Construct full artifact name
        run: echo "ARTIFACT_FULL_NAME=${{ env.ARTIFACT_NAME }}_linux.zip" >> $GITHUB_ENV
      - name: Create zip
        run: |
            cd ${{ env.BUILD_PATH_LINUX }}
            zip -r ${{ env.ARTIFACT_FULL_NAME }} .
      - name: Upload Release Asset
        id: upload-release-asset 
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ needs.create_release.outputs.tag-name }}
          files: ${{ env.BUILD_PATH_LINUX }}/${{ env.ARTIFACT_FULL_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
